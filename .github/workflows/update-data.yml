name: Update ETF data

on:
  schedule:
    # 北京时间 07:45 先跑；08:30、09:00 再兜底（UTC 分别为前一天 23:45、00:30、01:00）
    - cron: "45 23 * * 0-4"
    - cron: "30 0 * * 1-5"
    - cron: "0 1 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: etf-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONIOENCODING: utf-8
      LANG: C.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update snapshot and published JSON
        id: update
        run: |
          set -o pipefail
          python update_daily.py \
            --work data/current/history.json \
            --published public/api/history.json \
            --log-dir logs \
            --backup-dir data/backups \
            --retries 9 --retry-wait 300 2>&1 | tee /tmp/update.log

      - name: Record run status
        if: always()
        run: |
          python - <<'PY'
          import datetime, json, pathlib
          log = pathlib.Path("/tmp/update.log")
          tail = log.read_text(encoding="utf-8", errors="replace").splitlines()[-10:] if log.exists() else []
          pathlib.Path("data/current/ci-status.json").write_text(json.dumps({
              "checked_at": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
              "outcome": "${{ steps.update.outcome }}",
              "log_tail": tail,
          }, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Commit status and data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --cached --ignore-unmatch data/current/last_run.json >/dev/null 2>&1 || true
          git add -f data/current/ci-status.json
          git add data/current/history.json public/api/history.json
          if git diff --cached --quiet; then
            echo "没有变化"
          else
            git commit -m "更新运行记录 $(date -u +%Y-%m-%dT%H:%MZ)"
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                pushed=1
                break
              fi
              git rebase --abort 2>/dev/null || true
              sleep 10
            done
            if [ "$pushed" != "1" ]; then
              echo "git push 失败"
              exit 1
            fi
          fi

      - name: Publish snapshot to gh-pages
        if: steps.update.outcome == 'success'
        run: |
          git fetch --depth=1 origin gh-pages
          git worktree add /tmp/pages origin/gh-pages
          cp public/index.html public/style.css public/dashboard.js public/window.js /tmp/pages/
          cp public/api/history.json /tmp/pages/api/history.json
          cd /tmp/pages
          git add -A
          if git diff --cached --quiet; then
            echo "页面无变化"
          else
            latest=$(python -c "import json;print(json.load(open('api/history.json',encoding='utf-8'))['meta']['through'])")
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "发布数据快照：${latest}"
            git push origin HEAD:gh-pages
          fi

      - name: Request GitHub Pages build
        if: steps.update.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 推送 gh-pages 可能已自动触发构建，重复请求返回 409 时不算失败。
          gh api --method POST "repos/${{ github.repository }}/pages/builds" || echo "Pages 构建已在排队或进行中"

      - name: Fail when update failed
        if: steps.update.outcome != 'success'
        run: exit 1
