# 宽基ETF看板 Nginx 配置（大陆主机，静态页面 + 同源只读 JSON）
# 安装：把本文件复制为 /etc/nginx/conf.d/etf-dashboard.conf，替换 etf.example.com 与证书路径，
#      执行 nginx -t && systemctl reload nginx。
# 目录约定：网页根目录 /var/www/etf-dashboard，数据文件 api/history.json 由更新服务原子替换。

server {
    listen 80;
    listen [::]:80;
    server_name etf.example.com;

    # 证书签发期间保留 ACME 校验目录；其余请求跳转 HTTPS。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name etf.example.com;

    ssl_certificate     /etc/letsencrypt/live/etf.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/etf.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/etf-dashboard;
    index index.html;
    charset utf-8;
    server_tokens off;

    # 只读站点：拒绝任何写方法，更新只能由服务器本机文件权限完成。
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/javascript text/css text/html;

    # 看板读取的只读 JSON：无缓存，保证刷新即见最新已发布版本。
    location = /api/history {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files /api/history.json =404;
    }

    location = /api/history.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'" always;
    }

    # 更新脚本的临时文件、备份文件和隐藏文件一律不可访问。
    location ~ /\. {
        deny all;
    }
    location ~* \.(?:tmp-.*|bak|log)$ {
        deny all;
    }
}
